# The checks a change has to pass. Live tests are not among them: they drive a real Connect IQ SDK
# and a real simulator, neither of which a runner has, and they opt in with -PliveTests so a build
# without one is green rather than red for reporting the machine.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Monday morning, so a broken EAP is found by someone with a week to act on it.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build buildPlugin

      # The other half of the tests, and the half that catches a different kind of failure: an
      # extension named in plugin.xml that never registers is silent at run time. A language server
      # that was never registered simply never starts, and what the user sees is an editor with no
      # completion and nothing to report. It passes on a machine with no Connect IQ SDK, which is
      # what a runner is.
      - name: Self-check
        run: ./gradlew runSelfCheck

      - name: Keep the test report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test

      - uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: build/distributions/*.zip

  verify:
    name: Verify against the IDEs it claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # A job of its own so that a compatibility failure does not read as a failing test. It
      # checks the platform the plugin is compiled against; the sweep over every IDE JetBrains
      # recommends is -PverifyRecommended, and does not fit on a runner's disk.
      - name: Verify plugin
        run: ./gradlew verifyPlugin

      # The other end of the range. `sinceBuild` is a promise made to every user on an older IDE,
      # and the code is compiled against the newest one — so this is the only thing that can tell
      # us the promise is still true. Cheap enough to run on every push: one IDE, already the
      # subject of the check above's cache.
      - name: Verify against the oldest supported IDE
        run: ./gradlew verifyPlugin -PverifySince

      - name: Keep the verification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-report
          path: build/reports/pluginVerifier

  # Every IntelliJ plugin for this language before this one died of the same thing: an IDE upgrade
  # broke it and nobody noticed until users did. The issue trackers are full of it — a cast against
  # a JPS internal that changed, an action class that stopped loading, a New Project dialog that
  # stopped opening for everyone. Running against what JetBrains is about to release is how that
  # arrives as a red build instead.
  #
  # Weekly and on demand rather than on every push: both of these download whole IDEs and take far
  # longer than the rest. Allowed to fail, because these builds move on schedules that are not
  # ours and a break can be theirs — the point is that somebody looks.
  #
  # A runner each, rather than both in one job: several gigabytes of IDE apiece is more than one
  # runner's disk, and a red row should say which IDE it was without opening the log.
  future:
    name: ${{ matrix.name }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every IDE JetBrains recommends verifying against — which already includes the next
          # IDEA in EAP, months before it reaches anyone. That is the one that finds a removed
          # API while there is still time to say so on YouTrack.
          - name: Verify against every recommended IDE
            flag: -PverifyRecommended
            report: recommended
          # Not in that sweep at any price: it only ever picks the product the plugin is built
          # against. Android Studio is on a release train of its own, months behind the platform
          # under it, and a plugin that asks only for `com.intellij.modules.platform` is offered
          # to it either way — so it gets checked here.
          - name: Verify against Android Studio
            flag: -PverifyAndroidStudio
            report: android-studio
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Free the disk the IDEs need
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Verify plugin
        run: ./gradlew verifyPlugin ${{ matrix.flag }}

      - name: Keep the verification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-report-${{ matrix.report }}
          path: build/reports/pluginVerifier
