# The version the plugin publishes as, and the one the Marketplace orders releases by.
#
# Here rather than in build.gradle.kts so a release is a one-line change and CI can read it
# without parsing Kotlin. A `-beta.N` or `-eap.N` suffix also picks the update channel: see
# `publishing` in build.gradle.kts. The Marketplace refuses a version it has already seen, so this
# goes up with every upload, including a re-upload of a rejected one.
pluginVersion=0.1.0

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.parallel=true

# The IntelliJ Platform provides kotlin-stdlib at runtime; bundling it into the
# plugin distribution is a classloading hazard.
kotlin.stdlib.default.dependency=false
